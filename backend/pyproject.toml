[project]
name = "rag-answer-lifecycle"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.0",
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.1.3",
    "llama-cpp-python==0.3.36",
    "onnxruntime==1.31.0",
    "pgvector==0.5.1",
    "pillow==12.3.0",
    "psycopg[binary,pool]==3.3.6",
    "pypdfium2==5.14.0",
    "sqlalchemy[asyncio]==2.1.4",
    "tokenizers==0.23.3",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag-api = "app.main:main"
rag-migrate = "app.db:main"
rag-generation = "app.generation:main"
rag-documents = "app.document_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "app/_resources/migrations"
"config" = "app/_resources/config"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    # Matches the Chromium 1148 binary available for the U1 browser proof.
    "playwright==1.49.1",
    "pgserver==0.1.4",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
